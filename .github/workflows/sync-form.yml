name: Import repair jobs from the Google Form

# Reads the "Carcis job upload" form's response spreadsheet for rows that have
# not been imported yet, drafts each write-up with Gemini, and opens a pull
# request. The shop fills in the form; nobody touches the repo.
# Nothing reaches the live site from this workflow: every job it creates is
# marked "draft": true, and a person has to read it, correct it and merge.
#
# Cloudflare Pages builds a preview deployment for the branch this pushes,
# so the pull request is also the staging review.

on:
  schedule:
    # Every six hours. A body shop does not finish a car every ten minutes,
    # and this keeps the job well inside the free Actions allowance.
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Only check the spreadsheet columns. Imports nothing.'
        type: boolean
        default: false
      force:
        description: 'Re-import rows that were already imported'
        type: boolean
        default: false

concurrency:
  group: sync-form
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install import dependencies
        working-directory: tools
        run: npm install --no-audit --no-fund

      - name: Import from Drive
        id: sync
        working-directory: tools
        env:
          FORM_SHEET_ID: ${{ secrets.FORM_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          ARGS=""
          if [ "${{ inputs.check_only }}" = "true" ]; then ARGS="--check-columns"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "running: node sync-form.js $ARGS"
          node sync-form.js $ARGS

      - name: Rebuild the site
        if: steps.sync.outputs.imported != '' && steps.sync.outputs.imported != '0'
        run: node build.js

      - name: Open a pull request
        if: steps.sync.outputs.imported != '' && steps.sync.outputs.imported != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUGS: ${{ steps.sync.outputs.slugs }}
          COUNT: ${{ steps.sync.outputs.imported }}
        run: |
          set -euo pipefail
          BRANCH="job-import/$(date -u +%Y%m%d-%H%M%S)"
          git config user.name  "carcis-photo-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add content/jobs assets/work *.html work sitemap.xml
          git commit -m "Import $COUNT repair job(s) from the job upload form"
          git push origin "$BRANCH"

          {
            echo "Imported **$COUNT** job(s) from the Carcis job upload form."
            echo
            echo "Every job in this pull request is marked \`\"draft\": true\`, so its page"
            echo "is \`noindex\` and it does not appear on the home page, the work index"
            echo "or the sitemap yet."
            echo
            echo "### Before merging"
            echo
            echo "1. Open the Cloudflare Pages preview for this branch."
            echo "2. The vehicle, service and date are the shop's own answers from"
            echo "   the form and can be trusted. The title, summary, story and alt"
            echo "   text are a Gemini draft written from those facts plus the"
            echo "   photos, so read them and check every claim."
            echo "3. Look at \`_generated.uncertain\` in each JSON file. That is the"
            echo "   model telling you what it was not sure about."
            echo "4. Fix the wording so it sounds like Carlos, not like a brochure."
            echo "5. Set \`\"draft\": false\` on the jobs that are ready."
            echo "6. Run \`node build.js\` and commit, then merge."
            echo
            echo "Slugs in this batch: \`$SLUGS\`"
          } > /tmp/pr-body.md

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Job import: $COUNT repair job(s)" \
            --body-file /tmp/pr-body.md
