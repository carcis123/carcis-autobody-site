<!-- Measurement: Google Ads, Google Analytics 4 and Microsoft Clarity.
     Every ID lives in CARCIS_TRACKING below, and an empty string switches that
     service off. Google Ads and GA4 share one gtag.js loader.
     WARNING: this loads the Google tag directly, independent of the GTM
     container above. Do NOT also add a Google Ads or GA4 tag for these same
     IDs inside GTM-57K7RHSD or every conversion and page view will be counted
     twice. -->
<script>
  window.CARCIS_TRACKING = {
    ads: 'AW-18363583498',
    // Conversion labels (send_to values) from Google Ads > Goals > Conversions.
    adsBooking: 'AW-18363583498/8cLACP2cjOUcEIqYuLRE',   // Book appointment
    adsCall: 'AW-18363583498/0JXbCMeOi_scEIqYuLRE',      // Website phone number clicks
    // Leave ga4 empty. GA4 property G-WC1N8XG1KK is already a linked
    // destination of the Ads Google tag, so gtag.js loads it and every
    // gtag('event') reaches it. Configuring it here too would double count.
    ga4: '',                                             // GA4 measurement ID, G-XXXXXXXXXX
    clarity: ''                                          // Microsoft Clarity project ID
  };

  // gtag() is defined on every hostname so the lead tracking in site.js and
  // the Cal.com callback in estimate.html never throw; on staging it just
  // pushes into a dataLayer that nothing is listening to. Only the real tag
  // requests are gated.
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  if (window.CARCIS_LIVE) {
    (function (t) {
      var gtagScript = document.createElement('script');
      gtagScript.async = true;
      gtagScript.src = 'https://www.googletagmanager.com/gtag/js?id=' + (t.ga4 || t.ads);
      document.head.appendChild(gtagScript);
      gtag('js', new Date());
      if (t.ads) gtag('config', t.ads);
      if (t.ga4) gtag('config', t.ga4);

      if (t.clarity) {
        (function(c,l,a,r,i,s,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        s=l.createElement(r);s.async=1;s.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(s,y);
        })(window, document, "clarity", "script", t.clarity);
      }
    })(window.CARCIS_TRACKING);
  }
</script>
</head>
